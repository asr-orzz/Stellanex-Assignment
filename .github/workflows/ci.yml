name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      STELLANEX_RUNTIME_DIR: ${{ github.workspace }}/.ci-runtime/${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Compile sources
        run: python -m compileall src

      - name: Run automated tests
        run: pytest -q

      - name: Validate bundled demo dataset
        run: python -m stellanex_telemetry validate --dataset demo

  demo-report:
    name: Demo Report Artifact
    runs-on: ubuntu-latest
    needs: test
    env:
      STELLANEX_RUNTIME_DIR: ${{ github.workspace }}/.ci-runtime/report
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Generate demo fleet report
        run: |
          python -m stellanex_telemetry report --dataset demo --format json --output .ci-runtime/exports/demo_report.json

      - name: Upload demo fleet report artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-fleet-report
          path: .ci-runtime/exports/demo_report.json
          if-no-files-found: error

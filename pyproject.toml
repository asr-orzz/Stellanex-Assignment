[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellanex-telemetry-console"
version = "0.1.0"
description = "Desktop telemetry monitoring workbench for industrial substations."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anees" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
stellanex-console = "stellanex_telemetry.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
